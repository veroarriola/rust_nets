[package]
name = "perceptron_iris"
version = "0.1.0"
edition = "2024"

[dependencies]
# El núcleo de Burn y su backend de GPU
burn = { version = "0.21", features = ["train", "wgpu", "store"] }

csv = "1.4.0"

# IGU
iced = "0.14.0"

# Utilidades para manejar imágenes
image = "0.25.10"

polars = { version = "0.38", features = ["lazy", "csv"] }

rand = "0.10.2"

# El núcleo de Burn y su backend de GPU
rerun = "0.35.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

strum = "0.28.0"
strum_macros = "0.28.0"


tokio = { version = "1.53", features = ["sync", "rt"] }
